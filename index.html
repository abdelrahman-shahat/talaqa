<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B44D4">
<title>طلاقة للإنجليزي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Header, one scrolling view per tab, bottom tab bar.
   The talk tab docks a big round voice orb at the bottom: the one loud element. */
:root{
  --paper:#F3F5FB; --surface:#FFFFFF; --ink:#131A34; --muted:#5A6283; --line:#DDE2EF;
  --accent:#2B44D4; --accent-ink:#FFFFFF; --accent-soft:#E4E8FF;
  --bad:#C4372C; --bad-soft:#FBE7E5; --good:#16805A; --good-soft:#E1F3EA; --warn:#A86A12;
  --font-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-en:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
  --shadow:0 1px 2px rgba(19,26,52,.06),0 10px 28px -14px rgba(19,26,52,.22);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1121; --surface:#161B30; --ink:#E7EAF6; --muted:#9BA3C2; --line:#283050;
    --accent:#7D8DFF; --accent-ink:#0D1121; --accent-soft:#222A55;
    --bad:#FF8075; --bad-soft:#3A1F22; --good:#4FCB97; --good-soft:#15342A; --warn:#E9B35A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1121; --surface:#161B30; --ink:#E7EAF6; --muted:#9BA3C2; --line:#283050;
  --accent:#7D8DFF; --accent-ink:#0D1121; --accent-soft:#222A55;
  --bad:#FF8075; --bad-soft:#3A1F22; --good:#4FCB97; --good-soft:#15342A; --warn:#E9B35A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.en{font-family:var(--font-en);direction:ltr;text-align:left;unicode-bidi:isolate}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
ol{margin:0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

#app{display:grid;grid-template-rows:auto 1fr auto;height:100%;max-width:640px;margin:0 auto;background:var(--paper)}
header.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.45rem;font-weight:800;letter-spacing:0}
.brand .ipa{font-family:var(--font-en);font-size:.85rem;color:var(--muted);direction:ltr;white-space:nowrap}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none}
.iconbtn svg{width:20px;height:20px}

main{position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;display:none;padding:16px 16px 28px}
.view.on{display:block}
#v-talk{padding:0;overflow:hidden}
#v-talk.on{display:grid;grid-template-rows:auto 1fr auto}

nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{position:relative;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.74rem;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;line-height:18px;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.92rem;text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.84rem;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:.74rem;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.note{padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:.9rem}
.note.warn{background:var(--bad-soft)}
.note.ok{background:var(--good-soft)}
label.f{display:block;font-size:.84rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type="text"],input[type="search"],input[type="password"],textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:44px}
textarea{resize:vertical;min-height:84px;line-height:1.55}

/* ---------- Talk ---------- */
.talk-top{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.talk-top .scen{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.talk-top .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.84rem}
.msgs{min-height:0;overflow-y:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:88%;padding:10px 14px;border-radius:18px;font-family:var(--font-en);font-size:1.08rem;line-height:1.5;direction:ltr;text-align:left;overflow-wrap:anywhere}
.turn{display:flex;flex-direction:column;gap:6px}
.turn.ai{align-items:flex-end}
.turn.user{align-items:flex-start}
.turn.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.turn.user .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.turn.live .bubble{opacity:.85}
.turn .tools{display:flex;gap:4px}
.mini{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted)}
.mini svg{width:18px;height:18px}
.mini:hover{background:var(--accent-soft);color:var(--accent)}
.word{cursor:pointer;border-radius:4px}
.word:hover{background:var(--accent-soft)}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.4;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.fix{max-width:92%;width:100%;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.fix-item{display:flex;flex-direction:column;gap:2px}
.fix-line{font-family:var(--font-en);direction:ltr;text-align:left;font-size:1rem;overflow-wrap:anywhere}
.fix-line del{color:var(--bad);text-decoration-thickness:2px}
.fix-line ins{color:var(--good);text-decoration:none;font-weight:700}
.fix-line .arrow{color:var(--muted);margin:0 6px}
.fix .why{color:var(--muted)}
.fix .better{border-top:1px dashed var(--line);padding-top:8px}
.ok-chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;color:var(--good);font-weight:600}
.ok-chip svg{width:15px;height:15px}
.wait-chip{font-size:.8rem;color:var(--muted)}
.fold{border:0;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700}

.dock{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px}
#live{min-height:1.6em;font-family:var(--font-en);font-size:1.15rem;line-height:1.45;direction:ltr;text-align:left;color:var(--ink)}
#live.status{font-family:var(--font-body);direction:rtl;text-align:right;color:var(--muted);font-size:.92rem}
.dock-main{display:flex;align-items:center;gap:14px}
.mic{--lvl:0;position:relative;flex:none;width:78px;height:78px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);transition:box-shadow .08s linear}
.mic svg{width:32px;height:32px;position:relative;z-index:1}
.mic.listening{box-shadow:0 0 0 calc(var(--lvl) * 22px) color-mix(in srgb, var(--accent) 28%, transparent),var(--shadow)}
.mic.rec{background:var(--bad);color:#fff}
.mic.speaking::before,.mic.speaking::after,.mic.rec::before,.mic.rec::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;animation:ring 1.8s ease-out infinite}
.mic.speaking{color:var(--accent-ink)}
.mic.speaking::before,.mic.speaking::after{border-color:var(--accent)}
.mic.rec::before,.mic.rec::after{border-color:var(--bad)}
.mic.speaking::after,.mic.rec::after{animation-delay:.9s}
.mic.muted,.mic.off{background:var(--line);color:var(--muted)}
.mic.wait{background:var(--accent-soft);color:var(--accent)}
.mic[disabled]{opacity:.55}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}
.mic-side{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.mic-label{font-weight:700;font-size:1rem}
.dock-form{display:flex;gap:8px}
.dock-form input{flex:1}

.welcome{display:flex;flex-direction:column;gap:14px}
.hero{padding:6px 0 2px}
.hero h2{font-size:1.5rem;line-height:1.35}
.hero p{margin-top:6px;color:var(--muted)}
.scen-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scen-card{text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.scen-card b{font-family:var(--font-display);font-weight:700;font-size:.95rem}
.scen-card span{font-size:.8rem;color:var(--muted);line-height:1.45}
.scen-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.scen-card[aria-pressed="true"] b{color:var(--accent)}
.setup{border:2px solid var(--accent)}
.setup .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8rem;font-weight:700;flex:none}

/* ---------- Shared result blocks ---------- */
.item{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .head{display:flex;align-items:flex-start;gap:8px}
.item .en-big{font-family:var(--font-en);font-size:1.18rem;font-weight:700;direction:ltr;text-align:left;flex:1;min-width:0;overflow-wrap:anywhere}
.item .ipa{font-family:var(--font-en);color:var(--muted);font-size:.9rem;direction:ltr}
.item .ar{font-weight:600}
.item .ex{font-family:var(--font-en);direction:ltr;text-align:left;color:var(--muted);font-size:.95rem}
.item .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.boxdots{display:inline-flex;gap:3px;direction:ltr}
.boxdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.boxdots i.f{background:var(--good)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.preview{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.preview img{display:block;width:100%;max-height:320px;object-fit:contain;background:var(--paper)}
.preview .iconbtn{position:absolute;top:8px;left:8px}
details summary{cursor:pointer;font-weight:600;color:var(--muted)}

.practice{display:flex;flex-direction:column;gap:8px}
.result{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--paper)}
.result .marks{font-family:var(--font-en);direction:ltr;text-align:left;font-size:1.08rem;line-height:1.7}
.result .marks span{padding:0 2px;border-radius:4px}
.result .marks .y{color:var(--good)}
.result .marks .n{color:var(--bad);background:var(--bad-soft);text-decoration:underline wavy;text-underline-offset:4px}
.score{font-family:var(--font-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.score.good{color:var(--good)}.score.mid{color:var(--warn)}.score.low{color:var(--bad)}
.drill .text{font-family:var(--font-en);font-size:1.3rem;line-height:1.45;direction:ltr;text-align:left;font-weight:700}

/* ---------- Progress ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--font-display);font-size:1.7rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 2.2em;align-items:center;gap:8px;font-size:.86rem}
.bar .track{height:10px;border-radius:5px;background:var(--paper);overflow:hidden;border:1px solid var(--line)}
.bar .fill{display:block;height:100%;background:var(--bad);border-radius:5px}
.bar .n{font-variant-numeric:tabular-nums;text-align:left}
.level-badge{font-family:var(--font-en);font-weight:700;font-size:2.2rem;line-height:1;color:var(--accent)}

/* ---------- Sheet + toast ---------- */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,14,30,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90%;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
#sheet .sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
#sheet .sheet-head h2{flex:1;font-size:1.15rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:30;max-width:min(92vw,520px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.92rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.flash{text-align:center;padding:18px 8px}
.flash .en-card{font-family:var(--font-en);font-size:1.7rem;font-weight:700;line-height:1.35;direction:ltr}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1}
.range output{min-width:3.4em;font-variant-numeric:tabular-nums;font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.switch input{width:22px;height:22px}
.sect{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}

@media (prefers-reduced-motion: reduce){
  .mic::before,.mic::after,.dots i{animation:none!important}
  #toast,.mic{transition:none}
}
@media (min-width:520px){
  .scen-grid{grid-template-columns:repeat(3,1fr)}
  .tiles{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><h1>طلاقة</h1><span class="ipa">fluency /ˈfluːənsi/</span></div>
    <span class="spacer"></span>
    <button class="iconbtn" id="gear" type="button" aria-label="الإعدادات"></button>
  </header>
  <main>
    <section class="view" id="v-talk" aria-label="محادثة"></section>
    <section class="view" id="v-lens" aria-label="العدسة"></section>
    <section class="view" id="v-lib" aria-label="كلماتي"></section>
    <section class="view" id="v-pron" aria-label="النطق"></section>
    <section class="view" id="v-prog" aria-label="تقدمي"></section>
  </main>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div>
<div id="sheet" aria-hidden="true"><div class="scrim"></div><div class="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

}
const ICONS = {

  micoff: '<path d="M15 9.5V6a3 3 0 0 0-5.7-1.3M9 9v3a3 3 0 0 0 4.9 2.3M19 11a7 7 0 0 1-1.2 3.9M5 11a7 7 0 0 0 10.9 5.8M12 18v3M4 4l16 16"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="2"/>',

  speaker: '<path d="M4 10v4h3l5 4V6L7 10H4Z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
  star: '<path d="m12 4 2.4 5 5.4.6-4 3.7 1.1 5.4L12 16l-4.9 2.7L8.2 13.3l-4-3.7 5.4-.6L12 4Z"/>',
  trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',
  camera: '<path d="M4 8h3l2-2h6l2 2h3v11H4V8Z"/><circle cx="12" cy="13" r="3.5"/>',
  image: '<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4 4 3 3-2 4 3"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',

async function genDrills() {
  const P = S.pron; if (P.busy) return;
  if (!S.settings.apiKey) { openKeySetup(); return; }
  const lvl = S.settings.level; let prompt;
  if (P.source === 'words') {

    if (!words.length) { toast('احفظ كلمات في كلماتي الأول.'); return; }
    prompt = 'Create 6 short natural English sentences (at most 12 words each, level ' + lvl + ') that use these words or phrases, one or two per sentence: ' + words.join(' | ') + '\nReturn ONLY a JSON array: [{"text":"sentence","focus":"the word being practised","tip":"how to pronounce that word (stress and tricky sounds) in short Egyptian Arabic, with its IPA"}]';
  } else if (P.source === 'mistakes') {
    const ms = Store.all('mistake').sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 12);
    if (!ms.length) { toast('لسه مفيش أخطاء محفوظة. اتكلم شوية الأول.'); return; }
    prompt = 'An English learner (level ' + lvl + ') made these mistakes:\n' + ms.map((m) => '- "' + m.original + '" → "' + m.corrected + '"').join('\n') + '\nCreate 6 short, correct English sentences (at most 12 words each) that practise the same patterns, so the learner says them correctly out loud.\nReturn ONLY a JSON array: [{"text":"sentence","focus":"the pattern, short Arabic label","tip":"short reminder in Egyptian Arabic"}]';
  } else {
    prompt = 'Create 6 short English pronunciation-practice sentences (at most 12 words each, level ' + lvl + ') for an Egyptian Arabic speaker. Target sounds that are hard for Arabic speakers: p/b, v/f, th, short vs long vowels, consonant clusters, -ed endings, silent letters, word stress. Do not repeat these: ' + P.drills.map((d) => d.text).join(' | ') + '\nReturn ONLY a JSON array: [{"text":"sentence","focus":"target sound, short label","tip":"one short tip in Egyptian Arabic on how to produce it"}]';
  }
  P.busy = true; renderPron();
  try {
    const out = arr(await gen({ kind: 'quick', prompt })).filter((d) => d && clean(d.text)).slice(0, 8);
    if (!out.length) throw { code: 'empty' };
    P.drills = out.map((d) => ({ text: clean(d.text), focus: clean(d.focus), tip: clean(d.tip) }));
  } catch (e) { toast(errMsg(e)); }
  finally { P.busy = false; if (S.tab === 'pron') withFocus(views.pron, renderPron); }
}

function mistakeDrill(dr, i) {

async function genMistakeDrills() {

async function runAssess() {

  if (!clean(lines)) { toast('مفيش كلام محفوظ كفاية للتقييم. اتكلم محادثة جديدة.'); return; }
  const prof = S.items.profile || {};
  G.assessBusy = true; renderProg();
  try {
    const r = await gen({ kind: 'smart', prompt: 'Estimate the CEFR level of an Arabic-speaking English learner from their spoken lines below (speech-to-text; ignore punctuation and capitalization).\nLearner profile: ' + (prof.text || '(none)') + '\nLEARNER LINES:\n' + lines + '\nReturn ONLY JSON: {"overall":"A2|B1|B2|C1","speaking":"A2|B1|B2|C1","grammar":"A2|B1|B2|C1","vocabulary":"A2|B1|B2|C1","notes_ar":"2-3 sentences in Egyptian Arabic explaining the estimate","next_ar":["3 concrete things to work on, Egyptian Arabic"]}' });

function exportData() {

function importData(input) {
  const f = input.files && input.files[0]; input.value = ''; if (!f) return;

    const d = JSON.parse(t);

}
